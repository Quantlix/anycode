apiVersion: apps/v1
kind: Deployment
metadata:
  name: anycode-service
  labels:
    app.kubernetes.io/name: anycode-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anycode-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anycode-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "anycode-service"
        dapr.io/app-port: "8080"
    spec:
      serviceAccountName: anycode-service
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anycode
          image: your-registry.example/anycode-service:0.8.0
          imagePullPolicy: IfNotPresent
          command: ["anycode-service"]
          envFrom:
            - configMapRef:
                name: anycode-service
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              httpGet:
                path: /health/drain
                port: http
                scheme: HTTP
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi

