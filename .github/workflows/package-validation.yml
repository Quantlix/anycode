name: Package Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: package-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --group dev

      - name: Lint source
        run: uv run ruff check src/

      - name: Check formatting
        run: uv run ruff format --check src/

      - name: Run type checking
        run: uv run pyright

      - name: Run test suite
        run: uv run python -m pytest

      - name: Build distributions
        run: |
          rm -rf dist/ build/
          uv run python -m build --no-isolation

      - name: Verify distribution metadata
        run: uv run twine check --strict dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv .pkgtest
          . .pkgtest/bin/activate
          python -m pip install --upgrade pip
          wheel="$(ls dist/*.whl)"
          python -m pip install "${wheel}[cli]"
          anycode version
          python -c "from anycode import AnyCode; print(AnyCode.__name__)"
